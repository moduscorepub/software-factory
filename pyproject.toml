[project]
name = "software-factory"
version = "0.1.0"
description = "Software-factory control plane: intent -> Work Contract -> Jira -> coding harness -> PR evidence gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.scripts]
factory = "factory.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 120
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
